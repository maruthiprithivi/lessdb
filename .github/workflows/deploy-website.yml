name: Deploy website

# Rebuilds the static site from content and deploys it to Cloudflare
# Pages. Manual only — deployments are normally run directly (wrangler),
# not through Actions. Requires repo secrets CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID (see website/content/playbooks/manual-cloudflare-tasks.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the static site
        run: python3 scripts/build-site.py

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler pages deploy website \
            --project-name lessdb --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

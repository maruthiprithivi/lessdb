[package]
name = "lessdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "LessDB Python SDK: in-process analytical database"

[lib]
name = "lessdb"
crate-type = ["cdylib"]

[dependencies]
less-common = { path = "../../crates/less-common" }
less-catalog = { path = "../../crates/less-catalog" }
less-engine = { path = "../../crates/less-engine" }
less-query = { path = "../../crates/less-query" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
arrow = "59"
arrow-json = "59"
serde_json = "1"

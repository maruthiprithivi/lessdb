[package]
name = "less-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow = "59"
bytes = "1.12.1"
chrono = "0.4.45"
less-catalog = { path = "../less-catalog" }
less-common = { path = "../less-common" }
less-storage = { path = "../less-storage" }
less-telemetry = { path = "../less-telemetry" }
object_store = "0.13"
parquet = "59"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
less-query = { path = "../less-query" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

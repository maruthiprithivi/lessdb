[package]
name = "less-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.89"
arrow = "59"
fs2 = "0.4"
object_store = "0.13"
bytes = "1.12.1"
chrono = "0.4.45"
less-common = { path = "../less-common" }
less-storage = { path = "../less-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros"] }

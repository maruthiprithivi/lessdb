[package]
name = "less-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lessdb"
path = "src/main.rs"

[dependencies]
rustyline = "15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
arrow = { version = "59", features = ["prettyprint"] }
arrow-json = "59"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4.0"
datafusion = "55"
less-auth = { path = "../less-auth" }
less-catalog = { path = "../less-catalog" }
less-common = { path = "../less-common" }
futures = "0.3.34"
less-cypher = { path = "../less-cypher" }
less-engine = { path = "../less-engine" }
less-fanout = { path = "../less-fanout" }
less-gpu = { path = "../less-gpu", optional = true }
less-graph = { path = "../less-graph" }
less-mcp = { path = "../less-mcp" }
less-memory = { path = "../less-memory" }
less-query = { path = "../less-query" }
less-server = { path = "../less-server" }
less-storage = { path = "../less-storage" }
tracing = "0.1"
less-telemetry = { path = "../less-telemetry" }
less-vector = { path = "../less-vector" }
parquet = { version = "59", features = ["arrow", "zstd", "lz4", "snap"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[features]
gpu = ["dep:less-gpu"]
cloud = ["less-storage/cloud"]

[dev-dependencies]
uuid = { version = "1.26.0", features = ["v4"] }

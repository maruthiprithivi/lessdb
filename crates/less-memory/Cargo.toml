[package]
name = "less-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arrow = "59"
arrow-json = "59"
datafusion = "55"
less-catalog = { path = "../less-catalog" }
less-common = { path = "../less-common" }
less-engine = { path = "../less-engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "io-std"] }

[dev-dependencies]
uuid = { version = "1.26.0", features = ["v4"] }
